services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-translog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-translog}
      POSTGRES_DB: ${POSTGRES_DB:-translog}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-translog} -d ${POSTGRES_DB:-translog}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-translog}:${POSTGRES_PASSWORD:-translog}@db:5432/${POSTGRES_DB:-translog}
      STH_EPOCH: ${STH_EPOCH:-0}
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  pgdata:
